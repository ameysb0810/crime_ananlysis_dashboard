{% extends 'base.html' %}
{% block title %}Delete Record — CDAVP{% endblock %}
{% block content %}

<div class="row">
  <div class="col-md-8 offset-md-2">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <strong>⚠️ Confirm Delete</strong>
      </div>
      <div class="card-body">
        <p class="mb-3">Are you sure you want to delete this record?</p>
        <div class="alert alert-warning">
          <strong>{{ crime }}</strong>
        </div>
        <form method="POST">
          {% csrf_token %}
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button type="submit" class="btn btn-danger">🗑️ Delete Permanently</button>
            <a href="/crimes/" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
